# Builds the site with the GitHub Pages base path and publishes dist/.
# Pages must be set to "GitHub Actions" as its source, not "deploy from a
# branch" — docs/ holds the specs, it is not a site directory.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Placeholders are committed, so nothing regenerates here. Dropping a real
      # photo into public/img/ is enough to publish it. (The generator needs
      # macOS sips and would not run on this runner anyway.)
      - name: Build both locales
        env:
          # BASE_PATH is deliberately ABSENT, not set empty. The site moved to
          # the custom domain rapidconstructmd.com on 2026-09-06 and serves from
          # the ROOT; build.js already defaults the sub-path to '' when the
          # variable is unset. Setting it to anything non-empty emits every
          # asset, link and canonical as /rc-website/... which 404s on the live
          # domain. There is no longer a sub-path to configure.
          #
          # SITE_URL is set explicitly even though build.js now defaults to the
          # same value (W12-14), so the deployed host is stated where the deploy
          # is configured rather than inferred from a source default.
          SITE_URL: https://rapidconstructmd.com
          # W12-12. The canonical Google Business Profile URL, resolved in
          # W12-08 from the share.google shortlink. The CID form on purpose:
          # the shortlink redirects to a Search URL carrying a request
          # timestamp, a session token and a utm campaign, and a URL carrying
          # any of those never enters this repo. This reveals a LINK only.
          # R-K's prohibition on review markup is untouched by it.
          GOOGLE_REVIEWS_URL: https://maps.google.com/?cid=1981309119616115698
          # Absent until the client approves, which leaves the form in demo mode.
          WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
        run: |
          node build.js
          touch dist/.nojekyll

      # HTML only. Compressed image data contains the bytes '{{' by chance, and
      # GNU grep -r happily matches inside binaries where BSD grep skips them.
      - name: Fail if any placeholder survived
        run: |
          test -f dist/index.html && test -f dist/ru/index.html
          if grep -l '{{' dist/index.html dist/ru/index.html; then
            echo "unsubstituted placeholder in generated HTML"; exit 1
          fi
          echo "no placeholders survived"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
