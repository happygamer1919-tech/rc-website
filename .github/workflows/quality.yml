# The `quality` check, created by W14-02 (RC-102) under ruling R-V.
#
# Runs the machine-checkable gates from docs/CLAUDE.md section 11 on every pull
# request. Since the wave 19 amendment to R-V no card self-merges: every card
# takes this job green and stops for the owner.
# It never deploys: publishing stays in pages.yml, on push to main.
#
# Deliberately sets no build environment. build.js defaults the site origin and
# base path to their production values, and the form stays in demo mode without
# a key, which is correct for a check. The one exception is the last step
# (RC-145), which rebuilds with a stand-in key to check the form wiring.
name: quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # First, deliberately. A merge artifact otherwise surfaces as a confusing
      # failure in a later gate: W14-24a was found as "PROVENANCE.md table has
      # no rows" from the provenance check, three steps away from the cause.
      - name: No conflict markers or duplicate rows (R-Z)
        run: node scripts/check-merge-artifacts.js

      # W24-09a. Gate 21. `verify-live.js` measures the DEPLOYED site, so it cannot
      # run here and nothing in CI ever loaded it. W24-09 shipped it with backticks
      # inside its probe, which is a template literal: the file still PARSED, and it
      # threw a TypeError the moment it was loaded. Nineteen gates were green.
      # This loads the module and compiles its probe strings. No network, no Chrome.
      - name: verify-live loads and its probes compile (W24-09a)
        run: node scripts/verify-live.js --self-check

      - name: Build both locales
        run: node build.js

      # W24-09b. Gate 22. Wave 24 shipped the same class collision TWICE with every
      # gate green: `.bento__tile` (found by eye) and `.faq`, which silently added
      # 99px to all 20 service pages and was live for two days. Neither is a thing
      # a browser gate looks at unless someone thought to point one at it. Static,
      # zero dependency; its self-test is both real collisions, read from git.
      - name: No class declared twice with contradicting properties (W24-09b)
        run: node scripts/check-css-collisions.js

      - name: Links resolve
        run: node scripts/check-links.js

      - name: No stale values in governing documents
        run: node scripts/check-stale-docs.js

      - name: Every image has a provenance row (R-W)
        run: node scripts/check-asset-provenance.js

      - name: No countdowns, scarcity, financing or struck prices (R-X)
        run: node scripts/check-scarcity.js

      - name: Catalog category pages carry no prices, stock, cart or product records (RC-129)
        run: node scripts/check-catalog-pages.js

      # RC-142. Every inline svg is decorative (aria-hidden) or a named image, and
      # every diagram is a named, described image. Static, over the built HTML.
      - name: Every svg is decorative or a named image; every diagram is described (RC-142)
        run: node scripts/check-svg-a11y.js

      # RC-131. Gate 5 executes from here. Installed at a PINNED version rather
      # than vendored: the repo still has no package.json, no lockfile and
      # nothing in node_modules, which is a documented property of this build.
      - name: Install Lighthouse, pinned (RC-131)
        run: npm install -g lighthouse@13.4.1

      - name: Lighthouse floors, both locales (gate 5)
        run: node scripts/check-lighthouse.js

      - name: The built site names rapidconstruct.md and never the retired origin (W14-17)
        run: node scripts/check-origin.js

      # RC-139. The header fits in every template, both locales, at nine widths,
      # with at least the slack floor to spare. Drives the runner's own Chrome
      # (CHROME_BIN, or google-chrome on PATH) and needs the Inter webfont to load:
      # a width measured in a fallback font is not a measurement, so it fails.
      - name: Header fits with an 8px slack floor, both locales (RC-139)
        run: node scripts/check-header-fit.js

      # W23-01. No committed image carries GPS, and an image from the client-supplied
      # origin (R-W amendment, 2026-09-18) carries no metadata at all. Zero dependency:
      # the format walks and the byte scan are in the script, so CI needs no exiftool.
      # Corrected by W23-01a: every format, a file read by its bytes, and a self-test.
      - name: No GPS in any image, and client-supplied images stripped (W23-01)
        run: node scripts/check-image-metadata.js

      # W24-01. Every placeholder wave 24 renders has a row in
      # docs/PHOTO-SLOTS-W24.json and every row is rendered, both directions, over
      # the built tree. Static, no browser, zero dependency. It runs its own
      # three-arm self-test between two green controls before any real result,
      # which is what makes it a gate while the ledger is still filling.
      - name: Every placeholder has a ledger row, and every row is rendered (W24-01)
        run: node scripts/check-photo-slots-w24.js

      # W25-03d. Gate 23. Which manufacturer each ceramic plate really comes from is
      # research, and research held in prose is what let the site state a manufacturer
      # for 70 products that manufacturer does not make. The settlement is data now, in
      # content/plate-brand-settlement.json, and this holds the product records to it in
      # both directions. It does not visit any catalogue: it stops the records and the
      # settlement drifting apart, which is how the wrong claim survived.
      - name: Every ceramic plate's brand matches the settled catalogue match (W25-03d)
        run: node scripts/check-plate-brands.js

      # W25-12. Gate 24. docs/PHOTO-REVIEW-W25.md is the list the owner reads when
      # reviewing images by hand, and W25-R5 and W25-R7 both make a flag in it part
      # of the permission to use a picture at all. It is generated from the ledger,
      # the provenance rows and the product records rather than typed, and this
      # fails if the committed file and the data have drifted apart.
      - name: The photo review list matches the ledger (W25-12)
        run: node scripts/gen-photo-review-w25.js --check

      # W25-16. Gate 25. docs/OWNER-INTAKE-W25.md is the list the owner drops files
      # against, and the intake matches on the filename being the slot id EXACTLY,
      # so a slot id that drifts in that document is a file nothing will find. It
      # is generated from the ledger, the fence records and the built pages.
      - name: The owner intake list matches the data (W25-16)
        run: node scripts/gen-owner-intake-w25.js --check

      # RC-148. Every stub count stated in the governing and reference documents
      # equals the count measured from content/projects.json. Static, no browser.
      - name: The stub count in the documents equals the data (RC-148)
        run: node scripts/check-stub-count.js

      # RC-150. The supplier request list is generated from the product records,
      # so it cannot disagree with them. This fails if the committed file is stale.
      - name: The catalog image slot manifest matches the records (RC-150)
        run: node scripts/gen-catalog-image-slots.js --check

      # W19-D1. No heading is wider than its box and no page scrolls sideways, on
      # every sitemap page and both 404 pages, at 360px and 1280px. Same Chrome and
      # Inter requirement as the header gate. Before RC-145's step, which rebuilds.
      - name: No heading wider than its box, every page, 360 and 1280 (W19-D1)
        run: node scripts/check-heading-fit.js

      # W24-09. Gate 20. The one kind of defect nineteen gates cannot see: a layout.
      # W24-07 shipped a bento whose class names collided with the garduri page's,
      # the tall tile rendered 128px wide against an intended 380, and every gate
      # was green, because none of them reads a painted box. This measures computed
      # geometry in a real browser at 1440 and 390, both locales. Same Chrome and
      # Inter requirement as the header gate. Before RC-145's step, which rebuilds.
      - name: Every bento and catalogue grid is the geometry it is specified as (W24-09)
        run: node scripts/check-layout-geometry.js

      # W23-06. Every header dropdown, opened at rest with nothing under the pointer:
      # every text element in the Servicii panel and in the Catalog panel and its
      # sub-lists at 4.5:1 or better against what it is painted on, every page that
      # carries them, both locales. Same Chrome as the header gate. Before RC-145's
      # step, which rebuilds.
      - name: Every header dropdown item readable at rest, 4.5:1 (W23-06)
        run: node scripts/check-nav-contrast.js

      # RC-145. Every form POSTs to build.js's FORM_ENDPOINT_URL, armed, with the
      # configured recipient (the Web3Forms access key) and a subject, and every
      # sitemap page carries its form. A check has no secret, so this step alone
      # builds with a stand-in key and compares every form against it. LAST on
      # purpose: it rebuilds dist/ armed, which no earlier gate may measure. It never
      # sends, and it does not assert the endpoint's status (Q-W20-01).
      - name: Every form posts to the configured endpoint with the configured recipient (RC-145)
        env:
          WEB3FORMS_KEY: quality-wiring-standin
        run: |
          node build.js
          node scripts/check-form-wiring.js
